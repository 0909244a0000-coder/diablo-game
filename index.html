<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DIABLO IV : MOBILE BENCHMARK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0806;touch-action:none;
  font-family:"Times New Roman","Yu Mincho",serif;color:#d4c5a9}
#game{position:fixed;inset:0;display:block}
.hud{position:fixed;inset:0;pointer-events:none}

/* 上部 経験値バー */
.topbar{position:absolute;top:0;left:0;right:0;height:26px;
  background:linear-gradient(#0d0a07,#000);border-bottom:1px solid #3a2c1a;
  display:flex;align-items:center;padding:0 8px;gap:8px}
.lvl{font-size:12px;color:#c9a227;text-shadow:0 0 6px #c9a22766;white-space:nowrap}
.expwrap{flex:1;height:8px;background:#1a140e;border:1px solid #3a2c1a;border-radius:2px;overflow:hidden}
#expfill{height:100%;width:0%;background:linear-gradient(90deg,#5a3d12,#c9a227);
  box-shadow:0 0 8px #c9a22788;transition:width .2s}

/* 血球・怒気球 */
.orb{position:absolute;bottom:16px;width:74px;height:74px;border-radius:50%;
  border:2px solid #4a3a22;background:#0d0a07;overflow:hidden;
  box-shadow:0 0 18px #000 inset,0 0 12px #000}
.orb .fill{position:absolute;left:0;right:0;bottom:0;height:100%;
  transition:height .15s linear}
.orb.hp{left:12px}
.orb.hp .fill{background:radial-gradient(circle at 50% 30%,#ff3b2f,#8b0000 70%,#3a0000);}
.orb.rage{right:12px}
.orb.rage .fill{background:radial-gradient(circle at 50% 30%,#ff8c42,#b0341a 70%,#4a0f05);}
.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#f0e6d2;text-shadow:0 1px 2px #000;pointer-events:none}

/* スキルバー */
.skillbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;pointer-events:auto}
.sk{position:relative;width:52px;height:52px;border-radius:8px;
  border:1px solid #5a4526;background:linear-gradient(#241a10,#0e0a06);
  color:#e8dcc0;font-size:22px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 10px #000 inset,0 2px 6px #000;cursor:pointer}
.sk:active{transform:scale(.94)}
.sk .cool{position:absolute;inset:0;background:#000c;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.sk .key{position:absolute;bottom:2px;right:4px;font-size:8px;color:#7a6a4a}
.sk.ready{box-shadow:0 0 10px #c9a22755,0 0 10px #000 inset}

/* ジョイスティック */
.stickzone{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:auto}
#knob{position:absolute;width:56px;height:56px;border-radius:50%;
  border:2px solid #6a5634;background:radial-gradient(circle,#2a2014,#0d0a07);
  opacity:.35;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .15s}

/* メッセージ */
#msg{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:15px;
  color:#c9a227;text-shadow:0 0 10px #000,0 0 20px #c9a22766;opacity:0;transition:opacity .4s}
#msg.show{opacity:1}

/* ゲームオーバー */
#over{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:#000d;pointer-events:auto;gap:14px}
#over h1{font-size:30px;color:#8b0000;letter-spacing:4px;text-shadow:0 0 20px #ff000066}
#over p{font-size:13px;color:#a89878}
#over button{padding:10px 26px;font-size:15px;font-family:inherit;color:#e8dcc0;
  background:linear-gradient(#3a2c18,#1a120a);border:1px solid #6a5634;border-radius:4px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="topbar">
    <div class="lvl">LV <span id="lvlTxt">1</span></div>
    <div class="expwrap"><div id="expfill"></div></div>
    <div class="lvl" id="waveTxt">WAVE 1</div>
  </div>
  <div id="msg"></div>
  <div class="orb hp"><div class="fill" id="hpfill"></div><span id="hptxt">100/100</span></div>
  <div class="orb rage"><div class="fill" id="ragefill"></div><span id="ragetxt">0/100</span></div>
  <div class="skillbar" id="skillbar"></div>
  <div class="stickzone" id="stickzone"><div id="knob"></div></div>
  <div id="over"><h1>YOU DIED</h1><p id="overInfo"></p><button id="restart">再挑戦</button></div>
</div>

<script>
/* ================= 基本 ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let VW=0, VH=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW*DPR; cv.height = VH*DPR;
  cv.style.width = VW+'px'; cv.style.height = VH+'px';
}
window.addEventListener('resize', resize); resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const TAU=Math.PI*2;

/* ================= 地面テクスチャ ================= */
const groundPattern = (()=>{
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#1c1611'; g.fillRect(0,0,256,256);
  for(let i=0;i<2800;i++){
    const v=Math.random();
    g.fillStyle = v>0.6
      ? `rgba(70,56,38,${Math.random()*0.5})`
      : `rgba(10,8,6,${Math.random()*0.7})`;
    g.fillRect(Math.random()*256, Math.random()*256, Math.random()*2+1, Math.random()*2+1);
  }
  for(let i=0;i<10;i++){
    g.strokeStyle='rgba(0,0,0,0.4)'; g.lineWidth=Math.random()*1.5+.4;
    g.beginPath(); let x=Math.random()*256,y=Math.random()*256; g.moveTo(x,y);
    for(let j=0;j<5;j++){ x+=rand(-30,30); y+=rand(-30,30); g.lineTo(x,y); }
    g.stroke();
  }
  return ctx.createPattern(c,'repeat');
})();

/* ================= 状態 ================= */
const WORLD={w:2600,h:2600};
let player, enemies, drops, parts, texts, bolts, shake, cam, running, wave, waveTimer, spawnQueue, elapsed;

function reset(){
  player={
    x:WORLD.w/2, y:WORLD.h/2, r:15,
    hp:100, maxHp:100,
    rage:0, maxRage:100,
    level:1, exp:0, expNext:20,
    atk:11, critC:0.25, critD:1.9,
    atkSpeed:1.25, atkCd:0, swingT:0, swingDir:0,
    speed:185, facing:0,
    invuln:0, buffT:0, buffMul:1,
    whirlT:0, whirlTick:0,
    armor:0, kills:0
  };
  enemies=[]; drops=[]; parts=[]; texts=[]; bolts=[];
  shake=0; cam={x:player.x,y:player.y};
  running=true; wave=0; waveTimer=1.2; spawnQueue=[]; elapsed=0;
  SKILLS.forEach(s=>s.cd=0);
  document.getElementById('over').style.display='none';
  updateHUD();
}
function startWave(){
  wave++;
  const n = 4 + Math.floor(wave*1.6);
  const isBoss = wave%5===0;
  spawnQueue = [];
  for(let i=0;i<n;i++){
    let t='grunt';
    const r=Math.random();
    if(isBoss && i===0) t='boss';
    else if(r<0.15 && wave>=3) t='elite';
    else if(r<0.5 && wave>=2) t='brute';
    spawnQueue.push({type:t, delay:i*0.28});
  }
  showMsg(isBoss?'BOSS 出現':'WAVE '+wave);
  document.getElementById('waveTxt').textContent='WAVE '+wave;
}

/* ================= スキル ================= */
const SKILLS=[
  {name:'旋風斬', icon:'🌀', cd:0, cdMax:0.9, cost:15, color:'#c9a227'},
  {name:'跳躍撃', icon:'⚡', cd:0, cdMax:4.0, cost:20, color:'#e67e22'},
  {name:'戦吼',   icon:'📢', cd:0, cdMax:8.0, cost:30, color:'#c0392b'},
  {name:'先祖の槌',icon:'🔨', cd:0, cdMax:13.0,cost:50, color:'#8e44ad'}
];

/* ================= 入力 ================= */
const input={x:0,y:0,active:false,id:null,ox:0,oy:0};
const stickzone=document.getElementById('stickzone');
const knob=document.getElementById('knob');

function setKnob(x,y){ knob.style.left=x+'px'; knob.style.top=y+'px'; }

stickzone.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0]; input.id=t.identifier;
  input.ox=t.clientX; input.oy=t.clientY; input.active=true;
  knob.style.opacity=.7; setKnob(t.clientX,t.clientY); e.preventDefault();
},{passive:false});

stickzone.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier!==input.id) continue;
    let dx=t.clientX-input.ox, dy=t.clientY-input.oy;
    const len=Math.hypot(dx,dy), max=52;
    if(len>max){ dx=dx/len*max; dy=dy/len*max; }
    input.x=dx/max; input.y=dy/max;
    setKnob(input.ox+dx, input.oy+dy);
  }
  e.preventDefault();
},{passive:false});

function endTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier!==input.id) continue;
    input.active=false; input.x=0; input.y=0; input.id=null;
    knob.style.opacity=.35;
  }
}
stickzone.addEventListener('touchend',endTouch);
stickzone.addEventListener('touchcancel',endTouch);

// マウス（PC確認用）
let mouseDown=false;
stickzone.addEventListener('mousedown',e=>{
  input.ox=e.clientX; input.oy=e.clientY; input.active=true; mouseDown=true;
  knob.style.opacity=.7; setKnob(e.clientX,e.clientY);
});
window.addEventListener('mousemove',e=>{
  if(!mouseDown) return;
  let dx=e.clientX-input.ox, dy=e.clientY-input.oy;
  const len=Math.hypot(dx,dy), max=52;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  input.x=dx/max; input.y=dy/max; setKnob(input.ox+dx,input.oy+dy);
});
window.addEventListener('mouseup',()=>{mouseDown=false;input.active=false;input.x=0;input.y=0;knob.style.opacity=.35;});

/* ================= スキルバー生成 ================= */
const skillbar=document.getElementById('skillbar');
SKILLS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='sk';
  b.innerHTML=`${s.icon}<span class="key">${i+1}</span><div class="cool" style="display:none"></div>`;
  b.addEventListener('pointerdown',ev=>{ev.preventDefault(); castSkill(i);});
  skillbar.appendChild(b);
  s.el=b; s.coolEl=b.querySelector('.cool');
});

/* ================= 攻撃・スキル処理 ================= */
function nearestEnemy(maxR){
  let best=null,bd=maxR;
  for(const e of enemies){ const d=dist(player,e); if(d<bd){bd=d;best=e;} }
  return best;
}

function basicAttack(){
  const target=nearestEnemy(120);
  if(!target) return;
  player.facing=Math.atan2(target.y-player.y, target.x-player.x);
  player.swingT=0.18; player.swingDir=player.facing;
  const dmgBase=player.atk*(player.buffT>0?player.buffMul:1);
  for(const e of enemies){
    const d=dist(player,e);
    if(d>115) continue;
    const ang=Math.atan2(e.y-player.y, e.x-player.x);
    let diff=Math.abs(((ang-player.facing+Math.PI*3)%TAU)-Math.PI);
    if(diff<1.0){
      hitEnemy(e, dmgBase*rand(0.9,1.1));
    }
  }
  player.rage=Math.min(player.maxRage, player.rage+7);
  shake=Math.min(shake+2,8);
}

function hitEnemy(e, dmg){
  const crit=Math.random()<player.critC;
  const final=dmg*(crit?player.critD:1);
  e.hp-=final;
  e.flash=0.12;
  texts.push({x:e.x+rand(-8,8),y:e.y-e.r-6,vy:-46,life:0.8,max:0.8,
    txt:Math.round(final),crit});
  for(let i=0;i<(crit?9:5);i++){
    parts.push({x:e.x,y:e.y,vx:rand(-90,90),vy:rand(-90,90),
      life:rand(.2,.5),max:.5,r:rand(1.5,3.5),
      c:crit?'#ffcc44':'#c0392b'});
  }
  if(e.hp<=0) killEnemy(e);
}

function killEnemy(e){
  e.dead=true;
  player.kills++;
  const gain = e.type==='boss'?120 : e.type==='elite'?32 : e.type==='brute'?16 : 10;
  gainExp(gain);
  shake=Math.min(shake+ (e.type==='boss'?14:4), 18);
  // ドロップ
  const luck=Math.random();
  if(e.type==='boss'){
    drops.push(makeDrop(e.x,e.y,'legendary'));
    for(let i=0;i<4;i++) drops.push(makeDrop(e.x+rand(-40,40),e.y+rand(-40,40),'gold'));
  } else if(e.type==='elite' && luck<0.7){
    drops.push(makeDrop(e.x,e.y, luck<0.18?'legendary':'rare'));
  } else if(luck<0.45){
    drops.push(makeDrop(e.x,e.y, luck<0.1?'rare':'magic'));
  }
  for(let i=0;i<14;i++){
    parts.push({x:e.x,y:e.y,vx:rand(-160,160),vy:rand(-160,160),
      life:rand(.3,.8),max:.8,r:rand(2,5),c:'#8b0000'});
  }
}

function makeDrop(x,y,quality){
  return {x,y,r:9,quality,life:30,bob:Math.random()*TAU};
}
const QUALITY={
  gold:{c:'#c9a227',name:'金貨'},
  magic:{c:'#4a7bd4',name:'魔法装備'},
  rare:{c:'#d4c22a',name:'希少装備'},
  legendary:{c:'#c0621f',name:'伝説装備'}
};

function gainExp(n){
  player.exp+=n;
  while(player.exp>=player.expNext){
    player.exp-=player.expNext;
    player.level++;
    player.expNext=Math.floor(player.expNext*1.32+8);
    player.maxHp+=14; player.hp=player.maxHp;
    player.atk+=2.6;
    texts.push({x:player.x,y:player.y-40,vy:-60,life:1.4,max:1.4,txt:'LEVEL UP!',crit:true,big:true});
    for(let i=0;i<26;i++){
      const a=Math.random()*TAU, sp=rand(60,220);
      parts.push({x:player.x,y:player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        life:rand(.5,1.1),max:1.1,r:rand(2,4),c:'#c9a227'});
    }
  }
}

/* ================= スキル発動 ================= */
function castSkill(i){
  if(!running) return;
  const s=SKILLS[i];
  if(s.cd>0) return;
  if(player.rage < s.cost){ showMsg('怒気不足'); return; }
  player.rage-=s.cost;
  s.cd=s.cdMax;

  if(i===0){ // 旋風斬
    player.whirlT=1.1; player.whirlTick=0;
    showMsg('旋風斬');
  }
  else if(i===1){ // 跳躍撃
    const t=nearestEnemy(420);
    let ang=player.facing;
    if(t) ang=Math.atan2(t.y-player.y,t.x-player.x);
    const nx=clamp(player.x+Math.cos(ang)*190,40,WORLD.w-40);
    const ny=clamp(player.y+Math.sin(ang)*190,40,WORLD.h-40);
    for(let k=0;k<12;k++){
      parts.push({x:player.x,y:player.y,vx:rand(-60,60),vy:rand(-60,60),
        life:.4,max:.4,r:rand(2,5),c:'#e67e22'});
    }
    player.x=nx; player.y=ny; player.invuln=0.35;
    const dmg=player.atk*2.4*(player.buffT>0?player.buffMul:1);
    for(const e of enemies){
      if(dist(player,e)<150) hitEnemy(e,dmg);
    }
    shockwave(player.x,player.y,150,'#e67e22');
    shake=Math.min(shake+10,18);
  }
  else if(i===2){ // 戦吼
    player.buffT=6; player.buffMul=1.65;
    player.rage=Math.min(player.maxRage,player.rage+25);
    player.hp=Math.min(player.maxHp,player.hp+18);
    for(const e of enemies){
      if(dist(player,e)<230){
        texts.push({x:e.x,y:e.y-e.r-8,vy:-40,life:.9,max:.9,txt:'畏怖',crit:false,stun:true});
        e.stun=1.6;
      }
    }
    shockwave(player.x,player.y,230,'#c0392b');
    showMsg('戦吼');
  }
  else if(i===3){ // 先祖の槌
    const t=nearestEnemy(500);
    let ang=player.facing;
    if(t) ang=Math.atan2(t.y-player.y,t.x-player.x);
    const hx=clamp(player.x+Math.cos(ang)*170,20,WORLD.w-20);
    const hy=clamp(player.y+Math.sin(ang)*170,20,WORLD.h-20);
    const dmg=player.atk*4.2*(player.buffT>0?player.buffMul:1);
    setTimeout(()=>{
      if(!running) return;
      for(const e of enemies){
        if(dist({x:hx,y:hy},e)<190) hitEnemy(e,dmg);
      }
      shockwave(hx,hy,190,'#8e44ad');
      for(let i=0;i<40;i++){
        const a=Math.random()*TAU,sp=rand(80,320);
        parts.push({x:hx,y:hy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          life:rand(.4,1),max:1,r:rand(2,6),c:'#b06ce0'});
      }
      shake=Math.min(shake+16,22);
    },180);
    showMsg('先祖の槌');
  }
  updateHUD();
}

function shockwave(x,y,r,color){
  parts.push({ring:true,x,y,r:10,maxR:r,life:.5,max:.5,c:color});
}

/* ================= 敵生成 ================= */
const ENEMY_TYPES={
  grunt:{hp:26, spd:62, dmg:7, r:12, c:'#6b2a1e', xp:10},
  brute:{hp:62, spd:48, dmg:12, r:17, c:'#4a3a2a', xp:16},
  elite:{hp:150, spd:56, dmg:17, r:21, c:'#7a3a86', xp:32},
  boss :{hp:620, spd:44, dmg:26, r:32, c:'#8b1a1a', xp:120}
};

function spawnEnemy(type){
  const base=ENEMY_TYPES[type];
  const scale=1+ (wave-1)*0.16;
  let x,y;
  const side=randInt(0,3);
  const m=90;
  if(side===0){x=rand(0,WORLD.w);y=m;}
  else if(side===1){x=WORLD.w-m;y=rand(0,WORLD.h);}
  else if(side===2){x=rand(0,WORLD.w);y=WORLD.h-m;}
  else {x=m;y=rand(0,WORLD.h);}
  // プレイヤーに近すぎる場合は距離を取る
  if(dist({x,y},player)<420){
    const a=Math.atan2(player.y-y,player.x-x);
    x=player.x-Math.cos(a)*460; y=player.y-Math.sin(a)*460;
    x=clamp(x,40,WORLD.w-40); y=clamp(y,40,WORLD.h-40);
  }
  enemies.push({
    type,x,y,r:base.r,c:base.c,
    hp:base.hp*scale, maxHp:base.hp*scale,
    spd:base.spd*(1+ (wave-1)*0.02),
    dmg:base.dmg*scale,
    atkCd:rand(.4,1.4), flash:0, stun:0, dead:false,
    wob:Math.random()*TAU
  });
}

/* ================= 更新 ================= */
function update(dt){
  if(!running) return;
  elapsed+=dt;

  /* --- プレイヤー移動 --- */
  let mx=input.x, my=input.y;
  const mlen=Math.hypot(mx,my);
  if(mlen>0.12){
    const nx=mx/mlen, ny=my/mlen;
    const spd=player.speed*(mlen>0.9?1:mlen/0.9);
    player.x=clamp(player.x+nx*spd*dt,20,WORLD.w-20);
    player.y=clamp(player.y+ny*spd*dt,20,WORLD.h-20);
    player.facing=Math.atan2(ny,nx);
  }

  /* --- カメラ --- */
  cam.x+=(player.x-cam.x)*Math.min(1,dt*7);
  cam.y+=(player.y-cam.y)*Math.min(1,dt*7);

  /* --- タイマー --- */
  player.invuln=Math.max(0,player.invuln-dt);
  player.buffT=Math.max(0,player.buffT-dt);
  player.swingT=Math.max(0,player.swingT-dt);
  for(const s of SKILLS) s.cd=Math.max(0,s.cd-dt);
  shake*=Math.pow(0.001,dt);

  /* --- 自動攻撃 --- */
  player.atkCd-=dt;
  if(player.atkCd<=0){
    const t=nearestEnemy(120);
    if(t){ basicAttack(); player.atkCd=1/player.atkSpeed; }
  }

  /* --- 旋風斬 --- */
  if(player.whirlT>0){
    player.whirlT-=dt;
    player.whirlTick-=dt;
    if(player.whirlTick<=0){
      player.whirlTick=0.18;
      const dmg=player.atk*0.85*(player.buffT>0?player.buffMul:1);
      for(const e of enemies){
        if(!e.dead && dist(player,e)<125) hitEnemy(e,dmg*rand(.9,1.1));
      }
      for(let i=0;i<4;i++){
        const a=Math.random()*TAU;
        parts.push({x:player.x+Math.cos(a)*60,y:player.y+Math.sin(a)*60,
          vx:Math.cos(a)*100,vy:Math.sin(a)*100,life:.25,max:.25,r:3,c:'#c9a227'});
      }
    }
  }

  /* --- 敵 --- */
  for(const e of enemies){
    if(e.dead) continue;
    e.flash=Math.max(0,e.flash-dt);
    e.stun=Math.max(0,e.stun-dt);
    e.wob+=dt*6;
    if(e.stun>0) continue;

    const d=dist(player,e);
    const ang=Math.atan2(player.y-e.y,player.x-e.x);
    if(d>player.r+e.r-2){
      e.x+=Math.cos(ang)*e.spd*dt;
      e.y+=Math.sin(ang)*e.spd*dt;
    }
    e.atkCd-=dt;
    if(d<player.r+e.r+6 && e.atkCd<=0){
      e.atkCd=1.3;
      if(player.invuln<=0){
        const dmg=e.dmg*rand(.85,1.15);
        player.hp-=dmg;
        player.rage=Math.min(player.maxRage,player.rage+5);
        texts.push({x:player.x+rand(-6,6),y:player.y-24,vy:-50,life:.8,max:.8,
          txt:Math.round(dmg),hurt:true});
        shake=Math.min(shake+5,14);
        player.invuln=0.25;
        for(let i=0;i<6;i++){
          parts.push({x:player.x,y:player.y,vx:rand(-120,120),vy:rand(-120,120),
            life:.3,max:.3,r:rand(1.5,3),c:'#ff3b2f'});
        }
        if(player.hp<=0) gameOver();
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);

  /* --- ドロップ --- */
  for(const d of drops){
    d.life-=dt; d.bob+=dt*3;
    if(dist(player,d)<38){
      d.taken=true;
      if(d.quality==='gold'){ gainExp(4); }
      else{
        const q=QUALITY[d.quality];
        if(d.quality==='magic'){ player.atk+=1.2; player.maxHp+=4; player.hp+=4; }
        if(d.quality==='rare'){ player.atk+=2.4; player.critC+=0.01; player.maxHp+=8; player.hp+=8; }
        if(d.quality==='legendary'){ player.atk+=5; player.critC+=0.03; player.critD+=0.15; player.maxHp+=18; player.hp+=18; }
        showMsg(q.name+' 入手');
        for(let i=0;i<16;i++){
          const a=Math.random()*TAU,sp=rand(40,180);
          parts.push({x:d.x,y:d.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            life:rand(.3,.8),max:.8,r:rand(1.5,3.5),c:q.c});
        }
      }
    }
  }
  drops=drops.filter(d=>!d.taken && d.life>0);

  /* --- パーティクル --- */
  for(const p of parts){
    p.life-=dt;
    if(p.ring){ p.r+=(p.maxR-p.r)*Math.min(1,dt*14); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=Math.pow(0.02,dt); p.vy*=Math.pow(0.02,dt);
  }
  parts=parts.filter(p=>p.life>0);

  /* --- ダメージテキスト --- */
  for(const t of texts){ t.life-=dt; t.y+=t.vy*dt; t.vy*=Math.pow(0.1,dt); }
  texts=texts.filter(t=>t.life>0);

  /* --- ウェーブ進行 --- */
  if(spawnQueue.length){
    for(const s of spawnQueue) s.delay-=dt;
    while(spawnQueue.length && spawnQueue[0].delay<=0){
      spawnEnemy(spawnQueue.shift().type);
    }
  } else if(enemies.length===0){
    waveTimer-=dt;
    if(waveTimer<=0){ startWave(); waveTimer=2.2; }
  }

  updateHUD();
}

/* ================= 描画 ================= */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#070503';
  ctx.fillRect(0,0,VW,VH);

  const sx=(Math.random()-.5)*shake;
  const sy=(Math.random()-.5)*shake;
  ctx.save();
  ctx.translate(VW/2-cam.x+sx, VH/2-cam.y+sy);

  /* 地面 */
  ctx.fillStyle=groundPattern;
  ctx.fillRect(0,0,WORLD.w,WORLD.h);

  /* 地面の装飾（血痕・骨） */
  ctx.globalAlpha=.35;
  for(let i=0;i<40;i++){
    const x=(i*137.5)%WORLD.w, y=(i*241.7)%WORLD.h;
    ctx.fillStyle='#2a1a12';
    ctx.beginPath();
    ctx.ellipse(x,y,rand(8,24),rand(5,14),i,0,TAU);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  /* ドロップ */
  for(const d of drops){
    const q=QUALITY[d.quality];
    const bobY=Math.sin(d.bob)*3;
    const a=clamp(d.life/3,0,1);
    ctx.globalAlpha=a;
    ctx.shadowBlur=18; ctx.shadowColor=q.c;
    ctx.fillStyle=q.c;
    if(d.quality==='gold'){
      ctx.beginPath(); ctx.arc(d.x,d.y+bobY,5,0,TAU); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(d.x,d.y-10+bobY);
      ctx.lineTo(d.x+7,d.y+bobY);
      ctx.lineTo(d.x,d.y+10+bobY);
      ctx.lineTo(d.x-7,d.y+bobY);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  /* 敵 */
  for(const e of enemies){
    const wob=Math.sin(e.wob)*2;
    // 影
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(e.x,e.y+e.r*0.8,e.r*1.0,e.r*0.45,0,0,TAU); ctx.fill();

    if(e.type==='elite'||e.type==='boss'){
      ctx.strokeStyle=e.type==='boss'?'#ff3b2f':'#b06ce0';
      ctx.globalAlpha=.35+Math.sin(elapsed*4)*.15;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+8,0,TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }

    const g=ctx.createRadialGradient(e.x-e.r*.3,e.y-e.r*.3,2,e.x,e.y,e.r);
    if(e.flash>0){ g.addColorStop(0,'#fff'); g.addColorStop(1,'#ff8888'); }
    else { g.addColorStop(0,e.c); g.addColorStop(1,'#120a08'); }
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(e.x,e.y+wob,e.r,0,TAU); ctx.fill();

    // 目
    ctx.fillStyle=e.type==='boss'?'#ffdd44':'#ff5533';
    ctx.beginPath(); ctx.arc(e.x-e.r*.32,e.y-e.r*.15+wob,e.r*.13,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+e.r*.32,e.y-e.r*.15+wob,e.r*.13,0,TAU); ctx.fill();

    // HPバー
    if(e.hp<e.maxHp){
      const w=e.r*2.2, h=3;
      ctx.fillStyle='#000a';
      ctx.fillRect(e.x-w/2,e.y-e.r-12,w,h);
      ctx.fillStyle=e.type==='boss'?'#ff3b2f':'#c0392b';
      ctx.fillRect(e.x-w/2,e.y-e.r-12,w*(e.hp/e.maxHp),h);
    }
  }

  /* プレイヤー */
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(player.x,player.y+14,17,7,0,0,TAU); ctx.fill();

  // 旋風斬エフェクト
  if(player.whirlT>0){
    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.rotate(elapsed*14);
    ctx.strokeStyle='rgba(201,162,39,0.7)';
    ctx.lineWidth=4;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(0,0,52+i*8, i*2.1, i*2.1+1.8);
      ctx.stroke();
    }
    ctx.restore();
  }

  const pg=ctx.createRadialGradient(player.x-5,player.y-6,2,player.x,player.y,17);
  pg.addColorStop(0, player.invuln>0?'#ffffff':'#d8c8a8');
  pg.addColorStop(1,'#4a3826');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.arc(player.x,player.y,15,0,TAU); ctx.fill();

  // 向き
  ctx.strokeStyle='#c9a227';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(player.x+Math.cos(player.facing)*10, player.y+Math.sin(player.facing)*10);
  ctx.lineTo(player.x+Math.cos(player.facing)*24, player.y+Math.sin(player.facing)*24);
  ctx.stroke();

  // 攻撃スイング
  if(player.swingT>0){
    const a=player.swingT/0.18;
    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.rotate(player.swingDir);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(220,210,180,0.55)';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,100,-0.95+ (1-a)*0.6, 0.95+(1-a)*0.6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }

  // バフオーラ
  if(player.buffT>0){
    ctx.globalAlpha=.4+Math.sin(elapsed*8)*.15;
    ctx.strokeStyle='#ff6b35'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(player.x,player.y,26,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  /* パーティクル */
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    if(p.ring){
      ctx.globalAlpha=a*0.8;
      ctx.strokeStyle=p.c; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
    } else {
      ctx.globalAlpha=a;
      ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  /* ダメージ数字 */
  for(const t of texts){
    const a=clamp(t.life/t.max,0,1);
    ctx.globalAlpha=a;
    ctx.textAlign='center';
    if(t.big){
      ctx.font='bold 22px "Times New Roman",serif';
      ctx.fillStyle='#ffd700';
      ctx.shadowBlur=14; ctx.shadowColor='#ffd700';
      ctx.fillText(t.txt,t.x,t.y);
      ctx.shadowBlur=0;
    } else if(t.stun){
      ctx.font='italic 13px "Times New Roman",serif';
      ctx.fillStyle='#c084fc';
      ctx.fillText(t.txt,t.x,t.y);
    } else if(t.hurt){
      ctx.font='bold 16px "Times New Roman",serif';
      ctx.fillStyle='#ff3b2f';
      ctx.fillText('-'+t.txt,t.x,t.y);
    } else {
      ctx.font=t.crit?'bold 20px "Times New Roman",serif':'15px "Times New Roman",serif';
      ctx.fillStyle=t.crit?'#ffcc44':'#f0e6d2';
      if(t.crit){ ctx.shadowBlur=10; ctx.shadowColor='#ffcc44'; }
      ctx.fillText(t.txt,t.x,t.y);
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();

  /* ビネット（暗黒感） */
  const vg=ctx.createRadialGradient(VW/2,VH/2, Math.min(VW,VH)*0.25, VW/2,VH/2, Math.max(VW,VH)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.55,'rgba(0,0,0,0.45)');
  vg.addColorStop(1,'rgba(0,0,0,0.92)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,VW,VH);

  /* プレイヤー周囲の暖色光 */
  const px=VW/2-(cam.x-player.x), py=VH/2-(cam.y-player.y);
  const lg=ctx.createRadialGradient(px,py,10,px,py,260);
  lg.addColorStop(0,'rgba(255,190,120,0.10)');
  lg.addColorStop(1,'rgba(255,190,120,0)');
  ctx.fillStyle=lg;
  ctx.fillRect(0,0,VW,VH);
}

/* ================= HUD ================= */
const $=id=>document.getElementById(id);
function updateHUD(){
  $('hpfill').style.height=clamp(player.hp/player.maxHp,0,1)*100+'%';
  $('hptxt').textContent=Math.max(0,Math.ceil(player.hp))+'/'+Math.ceil(player.maxHp);
  $('ragefill').style.height=clamp(player.rage/player.maxRage,0,1)*100+'%';
  $('ragetxt').textContent=Math.floor(player.rage);
  $('lvlTxt').textContent=player.level;
  $('expfill').style.width=clamp(player.exp/player.expNext,0,1)*100+'%';

  SKILLS.forEach(s=>{
    const ready=s.cd<=0 && player.rage>=s.cost;
    s.el.classList.toggle('ready',ready);
    if(s.cd>0){
      s.coolEl.style.display='flex';
      s.coolEl.textContent=s.cd.toFixed(1);
    } else s.coolEl.style.display='none';
    s.el.style.opacity = (player.rage>=s.cost)?1:0.45;
  });
}

let msgTimer=null;
function showMsg(t){
  const el=$('msg');
  el.textContent=t; el.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>el.classList.remove('show'),1100);
}

function gameOver(){
  running=false;
  $('over').style.display='flex';
  $('overInfo').textContent=`LV ${player.level} / WAVE ${wave} / 撃破 ${player.kills}`;
}
$('restart').addEventListener('click',()=>{ reset(); });

/* ================= ループ ================= */
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  if(!lastT) { requestAnimationFrame(loop); return; }
  update(dt);
  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
